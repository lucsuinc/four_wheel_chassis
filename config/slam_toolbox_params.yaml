slam_toolbox:
  ros__parameters:

    # Plugin params（扫描匹配求解器，一般不用动）
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom              # 里程计坐标系
    map_frame: map                # 地图坐标系
    base_frame: base_footprint    # 机器人基座坐标系
    scan_topic: /scan             # 订阅的激光雷达数据话题
    mode: mapping                 # mapping=建图，localization=纯定位

    # 定位模式下加载已有地图
    #map_file_name: my_map
    #map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    throttle_scans: 1             # 每收到 1 帧处理 1 帧
    transform_publish_period: 0.02  # 50Hz 发布 map -> odom TF
    map_update_interval: 1.0      # 地图更新周期（秒）
    resolution: 0.05              # 地图分辨率：0.05 米/像素
    minimum_laser_range: 0.20     # RPLIDAR A2M8 最小有效测距 0.2m
    max_laser_range: 12.0         # RPLIDAR A2M8 最大有效测距 12.0m
    minimum_time_interval: 0.1    # 两次处理扫描的最小间隔（雷达 10Hz）
    transform_timeout: 0.2        # TF 查找超时（秒）
    tf_buffer_duration: 30.0      # TF 缓冲保留时间（秒）
    stack_capacity_to_concurrently_process: 5
    stack_size_to_use: 40000

    # General Parameters
    use_scan_matching: true       # 用激光匹配修正里程计漂移
    use_scan_barycenter: true
    minimum_travel_distance: 0.5  # 移动超过 0.5m 才处理新扫描
    minimum_travel_heading: 0.5   # 旋转超过 0.5 rad 才处理新扫描
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true         # 开启回环检测，消除累积误差
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5  # 信任里程计，搜索窗口较小
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
